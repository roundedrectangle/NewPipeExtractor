name: CI

on:
  # schedule:
  #     # once per day
  #   - cron: 0 0 * * *
  # push:
  #   branches:
  #     - dev
  #     - master
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRAALVM_VERSION: 23
  JDK_VERSION: 23
  GRAALVM_URL: https://download.oracle.com/graalvm/23/latest/graalvm-jdk-23_linux-aarch64_bin.tar.gz
  GRAALVM_HOME: /usr/lib/graalvm
  JAVA_HOME: /usr/lib/graalvm

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: install necessary stuff
        run: sudo apt update && sudo apt install -y build-essential curl zlib1g-dev tree

      - name: download & extract graalvm
        run: |
          curl -L -o graalvm.tar.gz $GRAALVM_URL && \
          sudo tar -xzf graalvm.tar.gz -C /usr/lib && \
          rm graalvm.tar.gz
      # todo: cache
        # uses: actions/cache@v4
        # with:
        #   path: ~/.gradle/caches
        #   key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        #   restore-keys: ${{ runner.os }}-gradle

        # See gradle file for difference between downloaders
      - name: do whatever this means
        run: sudo mv /usr/lib/graalvm-jdk-* /usr/lib/graalvm

      - name: build
        run: |
          export PATH=$JAVA_HOME/bin:$PATH
          ./gradlew nativeCompile

      - name: print some stuff for debugging in the future
        run: tree && echo "NOW LS -LH" && ls -lh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            extractor/build/native/nativeCompile/*.h
            appwrapper/build/native/nativeCompile/*.h
            extractor/build/native/nativeCompile/extractor.so
            appwrapper/build/native/nativeCompile/appwrapper.so
